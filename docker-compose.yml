services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hcms}
      POSTGRES_USER: ${POSTGRES_USER:-hcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcms} -d ${POSTGRES_DB:-hcms}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hcms}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hcms}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WARDEN_PASSWORD: ${WARDEN_PASSWORD:?Set WARDEN_PASSWORD in .env}
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./client
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
